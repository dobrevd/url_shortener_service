server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:master_redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  client-type: lettuce

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
    url-shortener-event-topic: ${SPRING_KAFKA_URL_SHORTENER_EVENT_TOPIC:url-shortener-event-topic}
    topic-replication-factor: ${SPRING_KAFKA_TOPIC_REPLICATION_FACTOR:1}
    topic-partitions: ${SPRING_KAFKA_TOPIC_PARTITIONS:3}
    producer:
      acks: ${SPRING_KAFKA_PRODUCER_ACKS:all}
      delivery-timeout: ${SPRING_KAFKA_PRODUCER_DELIVERY_TIMEOUT:12000}
      linger: ${SPRING_KAFKA_PRODUCER_LINGER:0}
      request-timeout: ${SPRING_KAFKA_PRODUCER_REQUEST_TIMEOUT:3000}
      idempotence: ${SPRING_KAFKA_PRODUCER_IDEMPOTENCE:true}
      inflight-requests: ${SPRING_KAFKA_PRODUCER_INFLIGHT_REQUESTS:5}
      properties:
        retries: ${SPRING_KAFKA_PRODUCER_PROPERTIES_RETRIES:3}
        compression.type: ${SPRING_KAFKA_PRODUCER_PROPERTIES_COMPRESSION_TYPE:snappy}
        batch.size: ${SPRING_KAFKA_PRODUCER_PROPERTIES_BATCH_SIZE:16384}

aws:
  region: ""
  sqs:
    queue: url-shortener-event-queue


logging:
  level:
    root: info

app:
  short_url_prefix: "my_short_url/"
  local_hash:
    capacity: 20
    min_value: 10
  hash:
    batch_size: 200
    expiration_period_hours: 1

  async:
    hash_generator:
      core_pool_size: 5
      max_pool_size: 10
      queue_capacity: 500
      thread_name_prefix: "AsyncExecutor-"
  local_hash_refill:
    core_pool_size: 5
    max_pool_size: 10
    queue_capacity: 500
    thread_name_prefix: "RefillExecutor-"
  scheduling:
    hash:
      cron: 0 0 0 * * *
    removal:
      cron: 0 0 0 * * *
      months_before_expiration: 12