services:
  app:
    build: .
    container_name: url-shortener
    restart: always
    networks:
      - url_shortener_network
    ports:
      - "8081:8080"
    env_file:
      - .env
    depends_on:
      master_postgres:
        condition: service_healthy
      master_redis:
        condition: service_healthy

  master_postgres:
    image: postgres:13.3
    container_name: master_postgres
    restart: always
    networks:
      - url_shortener_network
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $SPRING_DATASOURCE_USERNAME -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  master_redis:
    image: redis/redis-stack:latest
    container_name: master_redis
    restart: always
    networks:
      - url_shortener_network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-1:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    restart: always
    networks:
      - url_shortener_network
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=vk5hVY1_STGAwmoxZGYmSg
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9090,EXTERNAL://192.168.178.32:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  kafka-2:
    image: bitnami/kafka:latest
    ports:
      - "9094:9094"
    restart: always
    networks:
      - url_shortener_network
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_CLUSTER_ID=vk5hVY1_STGAwmoxZGYmSg
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9090,EXTERNAL://192.168.178.32:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  kafka-3:
    image: bitnami/kafka:latest
    ports:
      - "9096:9096"
    restart: always
    networks:
      - url_shortener_network
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_KRAFT_CLUSTER_ID=vk5hVY1_STGAwmoxZGYmSg
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9090,EXTERNAL://192.168.178.32:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  front_app:
    image: url-shortener-angular-frontend:dev
    container_name: url-shortener-frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - url_shortener_network
    depends_on:
      - app

  audit_app:
    image: url-audit-service
    container_name: url-audit
    restart: always
    networks:
      - url_shortener_network
    ports:
      - "8082:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:6.0
    container_name: audit-mongodb
    restart: always
    networks:
      - url_shortener_network
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  url_shortener_network:
    driver: bridge
    attachable: true